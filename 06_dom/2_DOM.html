<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM MANIPULATION</title>
</head>
<body style="background-color: #a47f7f; color:chartreuse">
    <!-- <--this is a comment which also create new nodes --> 
    <div class="parent">
<div class="day">Monday</div>
<div class="day">Tuesday</div>
<div class="day">Wednesday</div>
<div class="day">Thrusday</div>
    </div>
    </body>
    <script>
    const parent = document.querySelector('.parent');
//         console.log(parent);
//         console.log(parent.children); // for finding children 
// console.log(parent.children[1].innerHTML);

// using for loop 
for(let i = 0; i<parent.children.length;i++) {
     console.log(parent.children[i].innerHTML);
}

parent.children[1].style.color = "orange" // for getting first element child
console.log(parent.firstElementChild);
// for getting last element child 
console.log(parent.lastElementChild);
// 
  const dayOne = document.querySelector('.day');
  console.log(dayOne);
  console.log(dayOne.parentElement); // for getting parent  node 
// for getting all the nodes 
console.log("NODES :",parent.childNodes);


    </script>
    </html>
