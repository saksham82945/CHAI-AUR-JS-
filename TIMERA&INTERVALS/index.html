<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            position: relative;
        }

        /* ── Animated background orbs ── */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite alternate;
            pointer-events: none;
        }
        body::before {
            width: 500px; height: 500px;
            top: -120px; left: -120px;
            background: radial-gradient(circle, #7b2ff7, #4a00e0);
        }
        body::after {
            width: 400px; height: 400px;
            bottom: -100px; right: -100px;
            background: radial-gradient(circle, #00d2ff, #007aff);
            animation-delay: -4s;
        }

        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(40px, 30px) scale(1.1); }
        }

        /* ── Glass Card ── */
        .glass-card {
            position: relative;
            width: 420px;
            padding: 48px 40px 40px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0)   scale(1); }
        }

        /* ── Download Icon ── */
        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px; height: 64px;
            margin: 0 auto 24px;
            border-radius: 18px;
            background: rgba(123, 47, 247, 0.25);
            border: 1px solid rgba(123, 47, 247, 0.45);
            box-shadow: 0 0 24px rgba(123, 47, 247, 0.3);
            animation: pulse-icon 2s ease-in-out infinite;
        }
        .icon-wrapper svg {
            width: 32px; height: 32px;
            fill: none;
            stroke: #c084fc;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        @keyframes pulse-icon {
            0%, 100% { box-shadow: 0 0 24px rgba(123, 47, 247, 0.3); }
            50%       { box-shadow: 0 0 40px rgba(123, 47, 247, 0.6); }
        }

        /* ── Heading ── */
        h2 {
            font-size: 22px;
            font-weight: 600;
            color: #f0e6ff;
            text-align: center;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .sub-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            margin-bottom: 32px;
            letter-spacing: 0.2px;
        }

        /* ── Progress Container ── */
        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin-bottom: 14px;
            position: relative;
        }

        /* ── Progress Bar ── */
        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 100px;
            background: linear-gradient(90deg, #7b2ff7, #00d2ff);
            transition: width 0.4s ease;
            position: relative;
            box-shadow: 0 0 12px rgba(123, 47, 247, 0.7);
        }

        /* Shimmer sweep on the bar */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: -60%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.6s linear infinite;
        }
        @keyframes shimmer {
            to { left: 110%; }
        }

        /* ── Percent Text ── */
        .percent-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .percent {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
        }
        .percent-value {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            transition: all 0.3s ease;
        }

        /* ── Status Badge ── */
        .status-badge {
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #7b2ff7;
            box-shadow: 0 0 8px #7b2ff7;
            animation: blink 1.2s ease-in-out infinite;
            flex-shrink: 0;
        }
        .status-dot.done {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            animation: none;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }
        .status-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 400;
        }

        /* ── Complete state ── */
        .glass-card.complete .progress-bar::after { animation: none; }
        .glass-card.complete .icon-wrapper {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.45);
            box-shadow: 0 0 24px rgba(34, 197, 94, 0.3);
            animation: none;
        }
        .glass-card.complete .icon-wrapper svg { stroke: #4ade80; }
        .glass-card.complete h2 { color: #bbf7d0; }
    </style>
</head>
<body>

    <div class="glass-card" id="card">

        <div class="icon-wrapper" id="iconWrapper">
            <!-- Download arrow icon -->
            <svg id="dlIcon" viewBox="0 0 24 24">
                <path d="M12 3v13M7 11l5 5 5-5"/>
                <path d="M5 20h14"/>
            </svg>
        </div>

        <h2 id="heading">Downloading…</h2>
        <p class="sub-text" id="subText">Please wait while your file is being downloaded.</p>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="percent-row">
            <span class="percent">Progress</span>
            <span class="percent-value" id="percentText">0%</span>
        </div>

        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Connecting to server…</span>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
